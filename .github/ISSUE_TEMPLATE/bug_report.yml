name: Bug report / 程序错误
description: The checker crashed, printed a traceback, or behaved differently from the docs. 工具崩溃、报错或行为与文档不符。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste API keys, Authorization headers or unredacted replies.** 请勿粘贴 API Key、Authorization 头或未脱敏的回复。
        If a check gave a wrong pass/fail, use the "Wrong check result" template instead. 判定有误请用"检测结果有误"模板。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Output of `oacheck --version`
      placeholder: oacheck 2.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and OS / Python 与操作系统
      placeholder: Python 3.12.6, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / 命令
      description: Replace the host and any secrets with placeholders. 域名和敏感值用占位符替换。
      render: shell
      placeholder: oacheck --base-url https://api.example.com/v1 --model your-model-id --profile full
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened / 实际结果
      description: Include the redacted report or the error output. 附上脱敏报告或报错输出。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 预期结果
    validations:
      required: true
