name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m py_compile openai_compatible_checker.py ai_api_relay_checker.py
      - name: Unit and mock-gateway tests (no network)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          python openai_compatible_checker.py --version
          python openai_compatible_checker.py --list-checks

  package:
    name: build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel and run both entry points
        run: |
          python -m pip install dist/*.whl
          oacheck --version
          openai-compatible-checker --list-checks

  action:
    name: action smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # A throwaway value shared by the local mock gateway and the checker. Not a real key.
      OACHECK_MOCK_API_KEY: ci-mock-key-not-a-secret
      OPENAI_API_KEY: ci-mock-key-not-a-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start the local mock gateway
        shell: bash
        run: |
          python tests/mock_server.py --port 8787 > mock.log 2>&1 &
          for attempt in $(seq 1 50); do
            if python -c "import socket; socket.create_connection(('127.0.0.1', 8787), 1).close()" 2>/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat mock.log
          exit 1

      - name: Run the action against a healthy endpoint
        id: healthy
        uses: ./
        with:
          base-url: http://127.0.0.1:8787/ok/v1
          model: gpt-test
          profile: full
          runs: "2"
          artifact-name: action-smoke-healthy-${{ matrix.os }}

      - name: Check outputs of the healthy run
        shell: bash
        env:
          STATUS: ${{ steps.healthy.outputs.status }}
          PASSED: ${{ steps.healthy.outputs.passed }}
          FAILED: ${{ steps.healthy.outputs.failed }}
          REPORT: ${{ steps.healthy.outputs.report-path }}
        run: |
          test "$STATUS" = ok
          test "$PASSED" = 10
          test "$FAILED" = 0
          test -f "$REPORT"

      - name: Run the action against an endpoint without /responses
        id: broken
        uses: ./
        with:
          base-url: http://127.0.0.1:8787/responses-404/v1
          model: gpt-test
          profile: codex
          fail-on-error: "false"
          artifact-name: action-smoke-broken-${{ matrix.os }}

      - name: Check outputs of the broken run
        shell: bash
        env:
          STATUS: ${{ steps.broken.outputs.status }}
          FAILED: ${{ steps.broken.outputs.failed }}
        run: |
          test "$STATUS" = degraded
          test "$FAILED" = 1
